# Parámetros del equipo (reglamento §9.1).
#
# Acá solo van valores GENERALES: umbrales, ganancias, límites de velocidad,
# rangos de color. Nada que dependa del mapa de la competencia: nada de
# coordenadas, rutas ni posiciones de víctimas. El CI (tools/verificar_params.py)
# rechaza estos archivos si rompen la regla.
#
nodo_equipo:
  ros__parameters:
    frecuencia_control_hz: 10.0
    velocidad_lineal_max: 0.30      # m/s
    velocidad_angular_max: 1.00     # rad/s
    velocidad_regreso_ms: 0.25      # para usar en calcular_reserva. pd: no usamos velocidad maxima porque no queremos chocarnos nada y perder puntos por giros, etc
    factor_cambio: 1.5              # tmb en calcular_reserva
    margen_regreso_s: 20.0          # tmb en calcular_reserva
    duracion_corrida_s: 600.0       # usar en tiempo_restante
    periodo_logs_s: 10.0            # usar en toca_loguear
    
percepcion:
  ros__parameters:
    hue_rojo_bajo_1: 0.0            # caja 1 de rojo min
    hue_rojo_alto_1: 10.0           # caja 1 de rojo max
    hue_rojo_bajo_2: 170.0          # caja 2 min
    hue_rojo_alto_2: 180.0          # caja 2 max
    saturacion_min: 120.0           # piso de saturacion, menos es grisaceo
    valor_min: 80.0                 # piso de brillo, menos es muy oscuro
    ancho_min: 0.10                 # usar en estimar_mitad_caja
    ancho_max: 0.40                 # usar en estimar_mitad_caja
    distancia_minima_valida: 0.25   # usar en puntos_en_mapa
    rayos_minimos: 3                # usar en agrupaar_rachas

gestor_victimas:
  ros__parameters:
    radio_asociacion: 0.4           # usar en al_recibir_observacion
    min_avisos: 5                   # usar en esta_confirmada
    disp_max: 0.10                  # usar en esta_confirmada
    radio_duplicado: 0.6            # usar en es_duplicado
    espera_inicial_s: 5.0           # usar en hay_que_reportar

navegacion:
  ros__parameters:
    velocidad_maxima: 0.25
    radio_repulsion : .40
    ganancia_repulsiva: 0.15
    tiempo_asentamiento_s: 3.0
    tiempo_regreso_s: 480.0
    tolerancia_llegada: 0.15

localizador:
  ros__parameters:
    num_particulas: 500
    pose_inicial_x: 0.0
    pose_inicial_y: 0.0
    pose_inicial_theta: 0.0
    dispersion_inicial_xy: 0.35
    dispersion_inicial_theta: 0.5
    gamma1: 0.0025
    gamma2: 0.0025
    gamma3: 0.0025
    gamma4: 0.0025
    gamma5: 0.0025
    gamma6: 0.0025
    submuestreo_scan: 15
    sigma_sensor: 0.2
    escala_avance: 1.0
    escala_giro: 1.0
    publicar_nube: true

exploracion:
  ros__parameters:
    factor_escala: 4
    rango_cobertura: 2.0
    fov_camara_grados: 70.0
    margen_objetivo: 0.38
    tiempo_asentamiento_s: 6.0
    tiempo_max_objetivo_s: 45.0
    giro_orientar: 0.3
    tiempo_regreso_s: 480.0
    volver_a_la_largada: false
    publicar_done: false
